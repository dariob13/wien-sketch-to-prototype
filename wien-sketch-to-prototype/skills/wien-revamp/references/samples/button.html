            <div>

                  <wm-icon iconid="close" width="16" height="16"></wm-icon>
                </button>
              </wm-button>
              <wm-button kind="secondary" size="xs">
                <button type="button">

                  <span class="wm-h-vh">entfernen</span>

                </button>
              </wm-button>
            </div>
          </li>
        </ul>
      </wm-filter-selection>
    </div>
  </wm-details>
